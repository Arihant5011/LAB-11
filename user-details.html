<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--muted:#5b6b82;--line:#d5dde8;--accent:#2a6f97;--accent-dark:#1d526f;--err:#b3261e;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 8px 30px rgba(20,33,61,.07)}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.01em}
.sub{margin:0 0 24px;color:var(--muted);font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label,legend{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;padding:0}
input,select{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px}
input:focus,select:focus{outline:3px solid rgba(42,111,151,.25);border-color:var(--accent)}
.invalid input,.invalid select{border-color:var(--err)}
.msg{display:none;color:var(--err);font-size:.8rem;margin-top:4px}
.invalid .msg{display:block}
fieldset{border:0;margin:0;padding:0}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:8px;margin:0;font-weight:500;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.radios input{width:auto;accent-color:var(--accent)}
.radios label:has(input:checked){border-color:var(--accent);background:#eaf3f9}
.actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;padding:12px 22px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.ghost:hover{background:#eaf3f9}
.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.avatar{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:800}
.profile-head h1{margin:0}
dl{margin:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
dt{color:var(--muted);font-weight:600;font-size:.9rem}
dd{margin:0;font-weight:600;word-break:break-word}
@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:22px}.row{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<main class="card" id="output"></main>

<script>
// Edit these values to change what the page shows
const user = {
  name: "xyz",
  gender: "Male",
  mobile: "9876501234",
  email: "xyz@example.com",
  city: "Bengaluru",
  state: "Karnataka",
  country: "India"
};

const rows = [
  ["Full name", user.name],
  ["Gender", user.gender],
  ["Mobile number", user.mobile],
  ["Email ID", user.email],
  ["City", user.city],
  ["State", user.state],
  ["Country", user.country]
];

function esc(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById("output").innerHTML =
  '<div class="profile-head">' +
    '<div class="avatar">' + esc(user.name.charAt(0).toUpperCase()) + '</div>' +
    '<div><h1>' + esc(user.name) + '</h1><p class="sub" style="margin:0">User details</p></div>' +
  '</div>' +
  '<dl>' + rows.map(r => '<div class="row"><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>').join("") + '</dl>';
</script>
</body>
</html>
